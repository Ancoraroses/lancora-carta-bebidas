<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Àncora · Carta de begudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c3454;
    --navy-ink:#16283f;
    --gold:#c8963e;
    --cream:#f5f0e6;
    --linen:#efe7d6;
    --slate: #5b6b7a;
    --hair: rgba(28,52,84,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream); color:var(--navy);
    font-family:'Jost', -apple-system, sans-serif;
    font-size:18px; line-height:1.55;
    background-image:
      linear-gradient(rgba(27,58,63,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,58,63,0.045) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  h1,h2,h3{ font-family:'Playfair Display', Georgia, serif; font-weight:700; }
  a{ color:inherit; }
  .wrap{ max-width:920px; margin:0 auto; padding:0 22px; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative; min-height:92vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(200,150,62,0.10), transparent 60%),
      linear-gradient(180deg, var(--cream) 0%, var(--linen) 100%);
    color:var(--navy); padding:50px 20px;
  }
  .hero .grid-texture{
    position:absolute; inset:0; z-index:0; opacity:0.5;
    background-image:
      linear-gradient(rgba(28,52,84,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28,52,84,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .hero .bg-anchor-big{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-48%);
    width:78vh; height:78vh; opacity:0.05; color:var(--navy); z-index:0;
  }
  .hero .horizon{
    position:absolute; bottom:0; left:0; width:100%; height:auto; color:var(--gold);
    opacity:0.5; z-index:0;
  }
  .hero .stars{ position:absolute; inset:0; z-index:0; }
  .hero .stars .star{ position:absolute; color:var(--gold); opacity:0.55; }
  .hero::before{
    content:''; position:absolute; inset:14px; border:2.5px solid var(--navy);
    border-radius:2px; pointer-events:none; z-index:2;
  }
  .hero::after{
    content:''; position:absolute; inset:20px; border:1px solid var(--gold);
    border-radius:2px; pointer-events:none; z-index:2;
  }
  .hero .illus{ position:absolute; bottom:14%; opacity:0.85; z-index:0; color:var(--navy); }
  .hero .illus-boat{ left:2%; width:min(26vw, 300px); }
  .hero .illus-botanical{ right:4%; width:80px; bottom:16%; opacity:0.5; color:var(--navy); }
  .hero .illus-mountain{ right:0; bottom:12%; width:min(30vw, 340px); opacity:0.55; color:var(--slate); }
  .hero .bg-wave{ position:absolute; bottom:0; left:0; width:100%; opacity:0; z-index:0; }
  .hero-content{ position:relative; z-index:1; }
  .hero .emblem{
    width:112px; height:112px; margin:0 auto 18px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .hero .emblem svg.rope{ position:absolute; inset:0; width:100%; height:100%; color:var(--gold); }
  .hero .emblem svg.anchor-icon{ width:42px; height:42px; color:var(--navy); margin:0; opacity:1; }
  .hero .eyebrow{
    font-family:'Jost',sans-serif; font-size:13.5px; letter-spacing:4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px; font-weight:600;
  }
  .hero h1{ font-size:clamp(38px, 8vw, 70px); letter-spacing:1px; line-height:1; color:var(--navy); }
  .hero .tagline{
    margin-top:10px; font-size:16px; letter-spacing:2px; text-transform:uppercase;
    color:var(--navy); opacity:0.8; font-family:'Jost',sans-serif; font-weight:500;
  }
  .hero .divider-wave{ width:70px; height:12px; margin:16px auto 0; color:var(--gold); opacity:0.9; }
  .scroll-cue{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.65;
    display:flex; flex-direction:column; align-items:center; gap:8px; z-index:2; color:var(--navy);
  }
  .scroll-cue svg{ width:14px; height:18px; animation:bob 2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  /* ---------- STICKY NAV ---------- */
  .catnav{
    position:sticky; top:0; z-index:20; background:rgba(245,240,230,0.94);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--hair);
    max-width:920px; margin:0 auto;
  }
  .catnav .scroller{
    display:flex; gap:8px; overflow-x:auto; padding:12px 22px; flex:1;
    scrollbar-width:none;
  }
  .catnav .scroller::-webkit-scrollbar{ display:none; }
  .catnav a{
    flex:none; font-size:14px; letter-spacing:0.5px; text-decoration:none;
    padding:7px 14px; border-radius:20px; border:1px solid var(--hair);
    color:var(--slate); white-space:nowrap; transition:all .2s ease;
  }
  .catnav a.active{ background:var(--navy); color:var(--cream); border-color:var(--navy); }

  .night-banner{
    background:var(--navy); color:var(--gold); text-align:center;
    font-family:'Jost',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.5px;
    padding:9px 20px; border-bottom:1px solid var(--gold);
  }
  .night-banner .moon{ margin-right:6px; }

  /* ---------- WIDGET FLOTANTE: idiomas + Instagram ---------- */
  .side-widget{
    position:fixed; right:16px; bottom:16px; z-index:30;
    background:var(--navy); border:1px solid var(--gold); border-radius:30px;
    display:flex; align-items:center; gap:2px; padding:6px 8px;
    box-shadow:0 4px 16px rgba(28,52,84,0.28);
  }
  .side-widget .lang-btn{
    font-family:'Jost',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:0.5px;
    padding:6px 8px; border-radius:16px; border:none; background:none;
    color:var(--cream); cursor:pointer; opacity:0.55; transition:all .15s ease;
  }
  .side-widget .lang-btn:hover{ opacity:1; }
  .side-widget .lang-btn.active{ opacity:1; background:var(--gold); color:var(--navy-ink); }
  .side-widget .sep{ width:1px; height:16px; background:rgba(245,240,230,0.25); margin:0 4px; }
  .side-widget .ig-link{
    display:flex; align-items:center; justify-content:center; width:26px; height:26px;
    color:var(--cream); opacity:0.85; transition:opacity .15s ease;
  }
  .side-widget .ig-link:hover{ opacity:1; color:var(--gold); }
  .side-widget .ig-link svg{ width:17px; height:17px; }
  @media (max-width:480px){
    .side-widget{ right:10px; bottom:10px; padding:5px 6px; }
    .side-widget .lang-btn{ padding:5px 6px; font-size:10px; }
  }

  .group-block{ margin-bottom:22px; }
  .group-name{
    font-family:'Jost',sans-serif; font-size:13px; font-weight:600; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--slate); margin-bottom:8px; padding-bottom:4px;
    border-bottom:1px solid var(--hair); position:relative; z-index:1;
  }

  /* ---------- SECTIONS ---------- */
  section.category{ position:relative; padding:64px 0 20px; scroll-margin-top:64px; overflow:hidden; }
  section.category:nth-of-type(even){ background:var(--linen); }
  .section-watermark{
    position:absolute; width:340px; height:340px; opacity:0.05; z-index:0;
    top:-40px; right:-60px; pointer-events:none;
  }
  section.category:nth-of-type(even) .section-watermark{ right:auto; left:-60px; }
  .leaf-sprig{
    position:absolute; width:70px; height:230px; opacity:0.14; color:var(--slate);
    top:10px; right:18px; z-index:0; pointer-events:none;
  }
  .section-header{
    position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin-bottom:26px;
  }
  .section-header .icon{ width:34px; height:34px; color:var(--gold); flex:none; }
  .section-header h2{ font-size:30px; color:var(--navy); }
  .tier-legend{
    position:relative; z-index:1; font-size:14px; font-style:italic; color:var(--slate);
    margin:-14px 0 22px 0; padding-left:48px;
  }

  .items-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:2px 40px; }
  .item{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:9px 0; border-bottom:1px dotted var(--hair);
  }
  .item .name{ font-size:16.5px; }
  .item .price{ font-size:16.5px; font-weight:600; color:var(--gold); white-space:nowrap; font-family:'Jost',sans-serif;}

  .cocktail-item{ grid-column: 1 / -1; padding:12px 0; border-bottom:1px dotted var(--hair); }
  .cocktail-item .row{ display:flex; justify-content:space-between; align-items:baseline; }
  .cocktail-item .name{ font-size:19px; font-weight:600; font-family:'Playfair Display',serif; }
  .cocktail-item .price{ font-size:18px; font-weight:700; color:var(--gold); }
  .cocktail-item .desc{ font-size:14.5px; font-style:italic; color:var(--slate); margin-top:2px; max-width:640px; }

  .tier-block{ grid-column:1/-1; margin-bottom:6px; }
  .tier-block .tier-name{
    font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--navy);
    background:var(--gold); color:var(--cream); display:inline-block;
    padding:3px 10px; border-radius:12px; margin:14px 0 8px 0;
  }

  @media (max-width:640px){
    .items-grid{ grid-template-columns:1fr; }
    .section-header h2{ font-size:22px; }
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--navy); color:var(--cream); text-align:center; padding:56px 20px 40px;
    position:relative; overflow:hidden;
  }
  footer .anchor-icon{ width:40px; height:40px; opacity:0.85; margin-bottom:14px; }
  footer p{ font-size:13.5px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.7; line-height:2; }
  footer .leafwrap{ position:absolute; opacity:0.06; }
</style>
</head>
<body>

<header class="hero">
  <div class="grid-texture"></div>
  <svg class="bg-anchor-big" viewBox="0 0 100 100"><use href="#ic-anchor"/></svg>
  <div class="stars">
    <svg class="star" style="width:14px;height:14px;top:18%;left:16%;" viewBox="0 0 24 24" fill="currentColor"><use href="#ic-star"/></svg>
    <svg class="star" style="width:10px;height:10px;top:28%;right:20%;" viewBox="0 0 24 24" fill="currentColor"><use href="#ic-star"/></svg>
    <svg class="star" style="width:12px;height:12px;top:12%;right:32%;" viewBox="0 0 24 24" fill="currentColor"><use href="#ic-star"/></svg>
    <svg class="star" style="width:9px;height:9px;top:20%;left:32%;" viewBox="0 0 24 24" fill="currentColor"><use href="#ic-star"/></svg>
  </div>
  <svg class="horizon" viewBox="0 0 400 30" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M0 20 Q 25 12, 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20"/>
    <path d="M0 26 Q 25 18, 50 26 T 100 26 T 150 26 T 200 26 T 250 26 T 300 26 T 350 26 T 400 26" opacity="0.5"/>
  </svg>

  <svg class="illus illus-boat" viewBox="0 0 300 180" fill="none" stroke="currentColor" stroke-width="1.6">
    <use href="#ic-sailboat"/>
  </svg>
  <svg class="illus illus-mountain" viewBox="0 0 340 90" fill="none" stroke="currentColor" stroke-width="1.4">
    <use href="#ic-mountains"/>
  </svg>
  <svg class="illus illus-botanical" viewBox="0 0 60 200" fill="none" stroke="currentColor" stroke-width="1.6">
    <use href="#ic-leafsprig"/>
  </svg>

  <div class="hero-content">
    <div class="emblem">
      <svg class="rope" viewBox="0 0 100 100"><use href="#ic-rope"/></svg>
      <svg class="anchor-icon" viewBox="0 0 100 100"><use href="#ic-anchor"/></svg>
    </div>
    <div class="eyebrow">Bar · Restaurant · Roses</div>
    <h1>L'Àncora</h1>
    <div class="tagline" id="tagline">Carta de begudes · 40 anys vora el mar</div>
    <svg class="divider-wave" viewBox="0 0 70 12" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M0 6 Q 9 0, 17.5 6 T 35 6 T 52.5 6 T 70 6"/>
    </svg>
  </div>
  <div class="scroll-cue">
    <span id="scrolltext">Fes scroll</span>
    <svg viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1 L7 17 L13 1"/></svg>
  </div>
</header>

<nav class="catnav">
  <div class="scroller" id="catnav"></div>
</nav>

<div class="night-banner" id="nightbanner" style="display:none;"></div>

<main id="main"></main>

<div class="side-widget" id="sidewidget"></div>

<footer>
  <svg class="anchor-icon" viewBox="0 0 100 100"><use href="#ic-anchor"/></svg>
  <p id="footertext">L'Àncora Bar Restaurant · Roses, Costa Brava<br>40 anys vora el mar · 1986–2026</p>
</footer>

  note_whisky_refresco: { ca: "Combinat amb refresc: +2€ · Disponible en xopet: -3€ sobre el preu de la copa", es: "Combinado con refresco: +2€ · Disponible en chupito: -3€ sobre el precio de copa", en: "Mixed with a soft drink: +€2 · Available as a shot: -€3 off the glass price", fr: "Mélangé avec un soda : +2€ · Disponible en shot : -3€ sur le prix du verre" },
  note_vodka_refresco: { ca: "Combinat amb refresc: +2€ · Disponible en xopet: -3€ sobre el preu de la copa", es: "Combinado con refresco: +2€ · Disponible en chupito: -3€ sobre el precio de copa", en: "Mixed with a soft drink: +€2 · Available as a shot: -€3 off the glass price", fr: "Mélangé avec un soda : +2€ · Disponible en shot : -3€ sur le prix du verre" },
  note_licors_shot: { ca: "Disponible en xopet: -3€ sobre el preu de la copa", es: "Disponible en chupito: -3€ sobre el precio de copa", en: "Available as a shot: -€3 off the glass price", fr: "Disponible en shot : -3€ sur le prix du verre" },
  night_banner: { ca: "Recàrrec nocturn actiu ara mateix (+1€ en cerveses, licors, aperitius, refrescos, cafès i infusions)", es: "Recargo nocturno activo ahora mismo (+1€ en cervezas, licores, aperitivos, refrescos, cafés e infusiones)", en: "Late-night surcharge active now (+€1 on beer, spirits, aperitifs, soft drinks, coffee &amp; infusions)", fr: "Supplément de nuit actif en ce moment (+1€ sur bières, liqueurs, apéritifs, sodas, cafés et infusions)" },
};
</script>
<script>
/* ============================================================
   🌙  RECÀRREC NOCTURN — configuració (edita lliurement)
   ------------------------------------------------------------
   - NIGHT_HOUR: hora (0-23) a partir de la qual s'activa el recàrrec.
   - NIGHT_HOUR_END: hora (0-23) fins la qual dura (per si passa mitjanit).
   - NIGHT_AMOUNT: import del recàrrec en euros.
   - NIGHT_CATEGORIES: claus de categoria a les quals s'aplica
     (mira l'objecte MENU de dalt: "cerveses", "licors", "aperitius"...).
   - LIVE_MUSIC_DATES: dates concretes amb música en directe →
     recàrrec actiu TOT EL DIA. Format "AAAA-MM-DD", una per línia.
   - LIVE_MUSIC_WEEKDAYS: dies de la setmana amb música habitual
     (0=diumenge, 1=dilluns ... 6=dissabte). Deixa [] si no n'hi ha.
   ============================================================ */
const NIGHT_HOUR = 23;
const NIGHT_HOUR_END = 6;
const NIGHT_AMOUNT = 1.00;
const NIGHT_CATEGORIES = ['cerveses', 'licors', 'aperitius', 'refrescos', 'cafes', 'infusions'];

const LIVE_MUSIC_DATES = [
  // "2026-08-15",
  // "2026-09-01",
];
const LIVE_MUSIC_WEEKDAYS = [
  // 5, 6   // p.ex. divendres i dissabte
];

function pad2(n){ return String(n).padStart(2, '0'); }
function localDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function isNightSurchargeActive(){
  const now = new Date();
  const hour = now.getHours();
  const inNightHours = NIGHT_HOUR_END > NIGHT_HOUR
    ? (hour >= NIGHT_HOUR && hour < NIGHT_HOUR_END)
    : (hour >= NIGHT_HOUR || hour < NIGHT_HOUR_END);
  const isLiveMusicDate = LIVE_MUSIC_DATES.includes(localDateStr(now));
  const isLiveMusicWeekday = LIVE_MUSIC_WEEKDAYS.includes(now.getDay());
  return inNightHours || isLiveMusicDate || isLiveMusicWeekday;
}
</script>
<script>
/* ============================================================
   A partir de aquí: motor de renderizado. No hace falta tocarlo
   para actualizar precios.
   ============================================================ */
const euro = (n) => n.toFixed(2).replace('.', ',') + '€';

const SUPPORTED_LANGS = ['ca', 'es', 'en', 'fr'];
const LANG_NAMES = { ca: 'CA', es: 'ES', en: 'EN', fr: 'FR' };

function detectLang(){
  let saved = null;
  try { saved = localStorage.getItem('lancora_lang'); } catch(e) {}
  if(saved && SUPPORTED_LANGS.includes(saved)) return saved;
  const nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'ca']);
  for(const l of nav){
    const code = l.slice(0,2).toLowerCase();
    if(SUPPORTED_LANGS.includes(code)) return code;
  }
  return 'ca';
}

let LANG = detectLang();

function t(field){ return field[LANG] || field.ca; }

const SPRIGS = { cafes: 'coffeebranch', gintonic: 'leafsprig', cerveses: 'barley', rons: 'sugarcane', aperitius: 'grapes' };

function renderItem(it, extra=0){
  return `<div class="item"><span class="name">${it.n}</span><span class="price">${euro(it.p + extra)}</span></div>`;
}

function renderCocktail(it){
  return `<div class="cocktail-item">
    <div class="row"><span class="name">${it.n}</span><span class="price">${euro(it.p)}</span></div>
    ${it.d ? `<div class="desc">${t(it.d)}</div>` : ''}
  </div>`;
}

function renderTiered(cat){
  let out = '';
  const order = ['base','premium','superior','top'];
  const groups = {};
  cat.items.forEach(it => { (groups[it.tier] = groups[it.tier] || []).push(it); });
  order.forEach(tier => {
    if(!groups[tier]) return;
    const label = t(cat.tierLabels[tier]);
    out += `<div class="tier-block"><span class="tier-name">${label} · ${euro(groups[tier][0].p)}</span></div>`;
    groups[tier].forEach(it => {
      out += `<div class="item"><span class="name">${it.n}</span><span></span></div>`;
    });
  });
  return out;
}

function renderGroups(cat){
  return cat.groups.map(g => `
    <div class="group-block">
      <div class="group-name">${t(g.label)}</div>
      <div class="items-grid">${g.items.map(renderItem).join('')}</div>
    </div>
  `).join('');
}

function buildNav(){
  const nav = document.getElementById('catnav');
  nav.innerHTML = Object.entries(MENU).map(([key, cat]) =>
    `<a href="#${key}" data-key="${key}">${t(cat.title)}</a>`
  ).join('');
}

function buildSideWidget(){
  const box = document.getElementById('sidewidget');
  const langBtns = SUPPORTED_LANGS.map(l =>
    `<button class="lang-btn ${l===LANG?'active':''}" data-lang="${l}">${LANG_NAMES[l]}</button>`
  ).join('');
  box.innerHTML = `
    ${langBtns}
    <div class="sep"></div>
    <a class="ig-link" href="https://instagram.com/ancoraroses" target="_blank" rel="noopener" aria-label="Instagram @ancoraroses">
      <svg viewBox="0 0 24 24"><use href="#ic-instagram"/></svg>
    </a>
  `;
  box.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      LANG = btn.dataset.lang;
      try { localStorage.setItem('lancora_lang', LANG); } catch(e) {}
      renderAll();
      window.scrollTo({top:0, behavior:'instant'});
    });
  });
}

function buildSections(){
  const main = document.getElementById('main');
  const nightActive = isNightSurchargeActive();
  main.innerHTML = Object.entries(MENU).map(([key, cat]) => {
    const extra = (NIGHT_CATEGORIES.includes(key) && nightActive) ? NIGHT_AMOUNT : 0;
    let body;
    if(cat.tiered){
      body = renderTiered(cat);
    } else if(cat.groups){
      body = renderGroups(cat);
    } else if(cat.items.some(it => 'd' in it)){
      body = cat.items.map(renderCocktail).join('');
    } else {
      body = cat.items.map(it => renderItem(it, extra)).join('');
    }
    const wrapBody = cat.groups ? body : `<div class="items-grid">${body}</div>`;
    const legend = cat.tiered
      ? `<div class="tier-legend">${t(UI.tier_legend)}</div>`
      : (cat.note ? `<div class="tier-legend">${t(UI[cat.note])}</div>` : '');
    const sprigIcon = SPRIGS[key];
    const sprig = sprigIcon ? `<svg class="leaf-sprig" viewBox="0 0 60 200"><use href="#ic-${sprigIcon}"/></svg>` : '';
    return `
    <section class="category" id="${key}">
      <div class="wrap">
        <svg class="section-watermark" viewBox="0 0 24 24"><use href="#ic-${cat.icon}"/></svg>
        ${sprig}
        <div class="section-header">
          <svg class="icon" viewBox="0 0 24 24"><use href="#ic-${cat.icon}"/></svg>
          <h2>${t(cat.title)}</h2>
        </div>
        ${legend}
        ${wrapBody}
      </div>
    </section>`;
  }).join('');
}

function updateStaticText(){
  document.getElementById('tagline').textContent = t(UI.tagline);
  document.getElementById('scrolltext').textContent = t(UI.scroll);
  document.getElementById('footertext').lastChild.textContent = t(UI.footer);
  document.documentElement.lang = LANG;
}

function scrollSpy(){
  const links = [...document.querySelectorAll('#catnav a')];
  const sections = [...document.querySelectorAll('section.category')];
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        links.forEach(l => l.classList.toggle('active', l.dataset.key === e.target.id));
        const active = document.querySelector('#catnav a.active');
        if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      }
    });
  }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
  sections.forEach(s => io.observe(s));
}

function updateNightBanner(){
  const el = document.getElementById('nightbanner');
  if(isNightSurchargeActive()){
    el.style.display = 'block';
    el.innerHTML = `<span class="moon">🌙</span>${t(UI.night_banner)}`;
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

function renderAll(){
  buildNav();
  buildSideWidget();
  buildSections();
  updateStaticText();
  updateNightBanner();
  scrollSpy();
}

renderAll();
</script>
</body>
</html>
