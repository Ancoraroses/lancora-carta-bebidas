<style>
  /* Layout: cabecera corta de marca, barra de filtros fija, lista de vinos por tipo con la botella a la izquierda. */
  :root{
    --bg:#f5f0e6; --band:#efe7d6; --card:#fbf8f1; --ink:#1c3454; --ink-strong:#16283f;
    --gold:#a87a2a; --gold-soft:#c8963e; --muted:#5b6b7a; --hair:rgba(28,52,84,.18);
    --chip-on-bg:#1c3454; --chip-on-fg:#f5f0e6; --grid:rgba(28,52,84,.045);
    --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --body:'Jost',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --fs:1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1b2b; --band:#132235; --card:#182a41; --ink:#f1ead9; --ink-strong:#fbf6ea;
      --gold:#d9ab57; --gold-soft:#c8963e; --muted:#a9b6c3; --hair:rgba(241,234,217,.2);
      --chip-on-bg:#d9ab57; --chip-on-fg:#0f1b2b; --grid:rgba(241,234,217,.035); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1b2b; --band:#132235; --card:#182a41; --ink:#f1ead9; --ink-strong:#fbf6ea;
    --gold:#d9ab57; --gold-soft:#c8963e; --muted:#a9b6c3; --hair:rgba(241,234,217,.2);
    --chip-on-bg:#d9ab57; --chip-on-fg:#0f1b2b; --grid:rgba(241,234,217,.035); color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--body);
    font-size:calc(17px * var(--fs));line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:34px 34px;
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* Cabecera */
  .hero{text-align:center;border-bottom:1px solid var(--hair)}
  .hero .wrap{padding-block:34px 26px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .emblem{width:64px;height:64px;border:1.5px solid var(--gold-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);margin-bottom:6px}
  .emblem svg{width:30px;height:30px}
  .eyebrow{font-size:calc(12.5px * var(--fs));letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-family:var(--display);font-weight:700;font-size:calc(clamp(34px,8vw,56px) * var(--fs));line-height:1.05;color:var(--ink-strong);text-wrap:balance}
  .tagline{font-size:calc(14px * var(--fs));letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* Barra de filtros */
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--hair)}
  .bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
  .types{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
  .types::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--hair);background:transparent;color:var(--muted);border-radius:20px;
    padding:7px 14px;font-size:calc(14px * var(--fs));cursor:pointer;white-space:nowrap;transition:background .15s,color .15s
  }
  .chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
  .chip .n{opacity:.6;margin-left:5px;font-size:.85em}
  .tools{display:flex;gap:8px}
  .search{flex:1;min-width:0;border:1px solid var(--hair);background:var(--card);border-radius:22px;padding:9px 16px;font-size:calc(15px * var(--fs))}
  .search::placeholder{color:var(--muted)}
  .fbtn{flex:none;border:1px solid var(--ink);background:transparent;border-radius:22px;padding:9px 16px;font-weight:600;font-size:calc(14px * var(--fs));cursor:pointer}
  .fbtn[aria-expanded="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
  .panel{display:flex;flex-direction:column;gap:14px;padding:6px 0 4px;max-height:52vh;overflow-y:auto}
  .panel h3{font-size:calc(11.5px * var(--fs));letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
  .panel .set{display:flex;flex-wrap:wrap;gap:7px}
  .status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:calc(13px * var(--fs));color:var(--muted)}
  .clear{border:none;background:none;color:var(--gold);font-weight:600;cursor:pointer;text-decoration:underline;font-size:inherit}

  /* Lista */
  main .wrap{padding-block:8px 110px}
  section{padding-top:34px}
  section h2{font-family:var(--display);font-size:calc(28px * var(--fs));color:var(--ink-strong);display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  section h2 .count{font-family:var(--body);font-size:calc(13px * var(--fs));color:var(--muted);font-weight:500;letter-spacing:.5px}
  .list{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  @media (max-width:720px){.list{grid-template-columns:1fr}}
  .wine{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair);min-width:0}
  .wine .pic{flex:none;width:38px;display:flex;align-items:flex-start;justify-content:center}
  .wine .pic svg{width:30px;height:90px}
  .wine .pic img{width:38px;height:100px;object-fit:contain}
  .wine .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .pick{align-self:flex-start;font-size:calc(10.5px * var(--fs));letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--chip-on-fg);background:var(--chip-on-bg);border-radius:10px;padding:2px 9px}
  .wine h3{font-family:var(--display);font-weight:700;font-size:calc(18px * var(--fs));line-height:1.25;color:var(--ink-strong);overflow-wrap:anywhere}
  .meta{font-size:calc(13px * var(--fs));color:var(--muted)}
  .meta b{font-weight:600;color:var(--ink)}
  .grapes{font-size:calc(13.5px * var(--fs));font-style:italic;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .tag{font-size:calc(11.5px * var(--fs));border:1px solid var(--hair);border-radius:10px;padding:1px 8px;color:var(--ink)}
  .pair{font-size:calc(13px * var(--fs));color:var(--ink);margin-top:3px}
  .pair span{font-size:calc(10px * var(--fs));letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .prices{display:flex;gap:18px;margin-top:6px;font-variant-numeric:tabular-nums}
  .prices div{display:flex;flex-direction:column}
  .prices .k{font-size:calc(10px * var(--fs));letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .prices .v{font-size:calc(16px * var(--fs));font-weight:600;color:var(--gold)}
  .empty{padding:60px 0;text-align:center;color:var(--muted)}
  .empty p{margin-bottom:12px}

  footer{background:var(--band);border-top:1px solid var(--hair);text-align:center}
  footer .wrap{padding-block:30px 96px;font-size:calc(12.5px * var(--fs));letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);line-height:2}

  .widget{
    position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;
    background:#1c3454;border:1px solid #c8963e;border-radius:30px;display:flex;align-items:center;gap:2px;padding:5px 7px;
    box-shadow:0 4px 16px rgba(0,0,0,.28)
  }
  .widget button{border:none;background:none;color:#f5f0e6;opacity:.6;font-size:11px;font-weight:600;letter-spacing:.5px;padding:6px 7px;border-radius:16px;cursor:pointer}
  .widget button[aria-pressed="true"]{opacity:1;background:#c8963e;color:#16283f}
  .widget .sep{width:1px;height:16px;background:rgba(245,240,230,.25);margin:0 3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function prep(rows){
  return rows.filter(r=>r.nombre && TYPES[r.tipo]).map(r=>({
    id:r.id, n:r.nombre, prod:r.bodega||'', do:r.do||'', zona:r.zona||'',
    uvas:String(r.uvas||'').split(',').map(s=>s.trim()).filter(Boolean), tipo:r.tipo,
    p:{copa:num(r.copa),botella:num(r.botella),magnum:num(r.magnum),pvp:num(r.pvp)},
    est:String(r.estilo||'').split(/[\s,]+/).filter(k=>STYLES[k]),
    out: yes(r.agotado) || (String(r.stock||'').trim()!=='' && num(r.stock)<=0),
    mar:String(r.maridaje||'').split(/[\s,]+/).filter(k=>DISHES[k]),
    pick: yes(r.recomendado), foto:r.foto||''
  })).filter(w=>!w.out);
}
function parseCSV(text){
  const out=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);out.push(row);row=[];cur='';} else if(c!=='\r') cur+=c; }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  const head=out.shift().map(h=>norm(h.trim()));
  return out.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}

function match(w, skip){
  if(skip!=='tipo' && F.tipo && w.tipo!==F.tipo) return false;
  if(F.copas && w.p.copa==null) return false;
  if(F.zona.size && !F.zona.has(w.zona)) return false;
  if(F.uva.size && !w.uvas.some(u=>F.uva.has(u))) return false;
  if(F.est.size && !w.est.some(e=>F.est.has(e))) return false;
  if(F.q){ const h=norm([w.n,w.prod,w.do,w.zona,w.uvas.join(' '),w.mar.map(k=>tr(DISHES[k])+' '+DISHES[k].es).join(' ')].join(' ')); if(!norm(F.q).split(/\s+/).every(t=>h.includes(t))) return false; }
  return true;
}

  }).join('');
  document.getElementById('count').textContent = tr(UI.count)(list.length);
  const n=active();
  document.getElementById('fbtn').textContent = tr(UI.filters)+(n?` · ${n}`:'');
  const c=document.getElementById('clear'); c.hidden = !(n||F.q||F.tipo); c.textContent=tr(UI.clear);
}
function renderAll(){
  document.documentElement.lang=LANG;
  document.documentElement.style.setProperty('--fs',FS);
  document.getElementById('t-title').textContent=tr(UI.title);
  document.getElementById('t-tag').textContent=tr(UI.tag);
  document.getElementById('q').placeholder=tr(UI.search);
  document.getElementById('q').setAttribute('aria-label',tr(UI.search));
  document.getElementById('foot').innerHTML=tr(UI.foot);
  document.getElementById('widget').innerHTML = LANGS.map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===LANG}">${l.toUpperCase()}</button>`).join('')+
    `<span class="sep"></span><button type="button" id="fsbtn" aria-label="A+" aria-pressed="false">A+</button>`;
  renderTypes(); renderPanel(); renderList();
}
function clearAll(){ F.tipo=null;F.q='';F.zona.clear();F.uva.clear();F.est.clear();F.copas=false; document.getElementById('q').value=''; renderAll(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){ LANG=b.dataset.lang; try{localStorage.setItem('lancora_lang',LANG);}catch(_){} renderAll(); return; }
  if(b.id==='fsbtn'){ const st=[1,1.15,1.3]; FS=st[(st.findIndex(s=>Math.abs(s-FS)<.01)+1)%st.length]; try{localStorage.setItem('lancoraFontScale',FS);}catch(_){} document.documentElement.style.setProperty('--fs',FS); return; }
  if(b.id==='fbtn'){ const p=document.getElementById('panel'); p.hidden=!p.hidden; b.setAttribute('aria-expanded',String(!p.hidden)); return; }
  if(b.id==='clear'||b.dataset.clear){ clearAll(); return; }
  const g=b.dataset.g, v=b.dataset.v; if(!g) return;
  if(g==='tipo') F.tipo=v||null; else if(g==='copas') F.copas=!F.copas; else { F[g].has(v)?F[g].delete(v):F[g].add(v); }
  renderTypes(); renderPanel(); renderList();
});
document.getElementById('q').addEventListener('input',e=>{ F.q=e.target.value.trim(); renderTypes(); renderList(); });

renderAll();
if(SHEET_CSV_URL){
  fetch(SHEET_CSV_URL,{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{ const w=prep(parseCSV(t)); if(w.length){ WINES=w; renderAll(); } }).catch(()=>{});
}
</script>

</body>
